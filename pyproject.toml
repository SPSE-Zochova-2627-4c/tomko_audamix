[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audamix-frontend"
version = "0.1.0"
description = "Audamix Qt Widgets audio editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "numpy>=1.24", "scipy>=1.10", "soundfile>=0.12.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "mypy>=1.10", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audamix_frontend = ["resources/*.qss"]

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["src/**/*.py", "tests/test_frontend.py", "tests/test_editing.py", "tests/test_effects.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/audamix_frontend"]

[[tool.mypy.overrides]]
module = ["audamix.*"]
follow_imports = "skip"
